[package]
name = "pulsecut-desktop"
description = "PulseCut desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "pulsecut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulsecut-project-model = { path = "../../../crates/project-model" }
pulsecut-media-engine = { path = "../../../crates/media-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
