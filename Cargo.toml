[workspace]
resolver = "2"
members = [
  "crates/project-model",
  "crates/media-engine",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["ZeroPulse"]
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
project-model = { path = "crates/project-model" }
media-engine = { path = "crates/media-engine" }
